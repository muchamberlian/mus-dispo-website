<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Mu’s Disposable’s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Marker+Hatch&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7E49B3;
  --purple-deep:#5E3689;
  --ink:#1a1a1a;
  --muted:#333333;
  --paper:#F4F1EC;
  --bar:#EAE5DD;
  --mono:'Space Mono',monospace;
  --marker:'Rubik Marker Hatch',cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  min-height:100vh;
  background-color:#CFCFCF;
  background-image:radial-gradient(rgba(0,0,0,.12) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--ink);
  font-family:var(--mono);
}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}

/* ---------- Desktop (landing) ---------- */
.welcome{
  margin:0;
  padding:28px 16px 0;
  text-align:center;
  font-family:var(--marker);
  font-weight:400;
  font-size:clamp(26px,5.2vw,46px);
  line-height:1.2;
}
.desktop{
  min-height:calc(100vh - 100px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:40px;padding:16px 16px 48px;
}
.folders{display:flex;flex-wrap:wrap;justify-content:center;gap:28px}
.folder{
  border:0;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:8px;border-radius:12px;
}
.folder svg{
  width:clamp(88px,15vw,132px);height:auto;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));
}
.folder .label{
  font-size:16px;font-weight:700;padding:3px 10px;border-radius:6px;
}
.folder:hover .label,.folder:focus-visible .label{background:var(--ink);color:#fff}
.folder:focus-visible,.close:focus-visible,.back:focus-visible,.nav:focus-visible,.tile:focus-visible{
  outline:3px solid var(--purple);outline-offset:3px;
}
.hint{margin:0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .folder svg{transition:transform .15s ease}
  .folder:hover svg{transform:translateY(-4px)}
  .win{animation:open .18s ease-out}
  @keyframes open{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
}

/* ---------- Folder window ---------- */
.scrim{
  position:fixed;inset:0;z-index:10;
  background:rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;padding:12px;
}
.win{
  width:min(940px,100%);height:min(660px,100%);
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);
  border:1px solid rgba(0,0,0,.18);border-radius:12px;
  box-shadow:0 18px 40px rgba(0,0,0,.28);
}
.bar{
  position:relative;flex:none;height:44px;
  background:var(--bar);border-bottom:1px solid rgba(0,0,0,.1);
  display:flex;align-items:center;padding:0 8px;gap:8px;
}
.close{
  position:relative;z-index:1;
  width:44px;height:44px;border:0;background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
}
.close span{width:14px;height:14px;border-radius:50%;background:#E5484D}
.dot{position:relative;z-index:1;width:12px;height:12px;border-radius:50%}
.dot.amber{background:#E8A33D}
.dot.green{background:#4CAF7A}
#win-title{
  position:absolute;left:0;right:0;margin:0;text-align:center;
  font-size:14px;font-weight:700;pointer-events:none;
}
.body{flex:1;min-height:0;overflow-y:auto;padding:16px}
.status{
  flex:none;min-height:36px;
  background:var(--bar);border-top:1px solid rgba(0,0,0,.1);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 16px;font-size:13px;color:var(--muted);
}
.back{border:0;background:transparent;cursor:pointer;font-weight:700;padding:8px 4px;border-radius:6px;color:var(--ink)}
.back:hover{text-decoration:underline}

/* Gallery: every tile is the same fixed shape, photos are cropped to fit */
.grid{
  display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
}
.tile{
  padding:0;cursor:pointer;aspect-ratio:4/5;overflow:hidden;
  border:4px solid #fff;border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
  background:var(--tone,#8a7f72);
}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.tile.ghost{cursor:default}

.empty{display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px}

/* Viewer: the whole photo shows, never cropped */
.viewer{display:flex;align-items:center;gap:12px}
.nav{
  flex:none;width:44px;height:44px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(0,0,0,.15);background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;padding:0;
}
.nav svg{width:16px;height:16px}
.stage{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.stage img{
  display:block;max-width:100%;max-height:100%;
  border:8px solid #fff;border-radius:4px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
@media (max-width:560px){
  .viewer{gap:6px}
  .body{padding:12px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
</style>
</head>
<body>

<h1 class="welcome">Welcome to Mu’s Disposable’s</h1>

<main class="desktop">
  <div class="folders" id="folders"></div>
  <p class="hint">Click a folder to open</p>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="bar">
      <button class="close" id="close" type="button" aria-label="Close folder"><span></span></button>
      <span class="dot amber" aria-hidden="true"></span>
      <span class="dot green" aria-hidden="true"></span>
      <h2 id="win-title"></h2>
    </div>
    <div class="body" id="body"></div>
    <div class="status">
      <span id="status"></span>
      <button class="back" id="back" type="button" hidden>&larr; Back to gallery</button>
    </div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   ADD PHOTOS HERE (later). Each photo looks like:
     { thumb: 'thumbs/2025/2025-001.jpg', full: 'photos/2025/2025-001.jpg', caption: '' }
   Until the resize workflow exists, thumb and full can be the same file.
   An empty list shows placeholder tiles.
------------------------------------------------------------------- */
const FOLDERS = [
  { id: '2026',  type: 'photos', photos: [] },
  { id: '2025',  type: 'photos', photos: [] },
  { id: '2024',  type: 'photos', photos: [] },
  { id: 'Video', type: 'video',  photos: [] }
];

const TONES = ['#8a7f72','#5d6b6e','#b08968','#7d8a6a','#a3836f','#6b5b73','#9a8c7a','#66736a'];
const FOLDER_ICON =
  '<svg viewBox="0 0 112 92" aria-hidden="true">' +
  '<path d="M6 14a6 6 0 0 1 6-6h28a6 6 0 0 1 4.5 2l6 7H100a6 6 0 0 1 6 6v58a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6z" fill="#5E3689"/>' +
  '<rect x="6" y="28" width="100" height="58" rx="6" fill="#7E49B3"/>' +
  '<rect x="6" y="28" width="100" height="4" rx="2" fill="#fff" opacity=".35"/></svg>';
const ARROW = {
  prev: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  next: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

const $ = (s) => document.querySelector(s);
const scrim = $('#scrim'), win = $('#win'), body = $('#body');
const state = { folder: null, index: null, trigger: null };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/* ---------- Landing: one folder per year ---------- */
FOLDERS.forEach((f) => {
  const b = el('button', 'folder');
  b.type = 'button';
  b.innerHTML = FOLDER_ICON;
  b.appendChild(el('span', 'label', f.id));
  b.addEventListener('click', () => openFolder(f, b));
  $('#folders').appendChild(b);
});

function openFolder(folder, trigger) {
  state.folder = folder; state.index = null; state.trigger = trigger;
  scrim.hidden = false;
  document.body.classList.add('locked');
  render();
  $('#close').focus();
}
function closeFolder() {
  scrim.hidden = true;
  document.body.classList.remove('locked');
  if (state.trigger) state.trigger.focus();
  state.folder = null; state.index = null;
}
function backToGallery() {
  const i = state.index;
  state.index = null;
  render();
  const tiles = body.querySelectorAll('.tile:not(.ghost)');
  if (tiles[i]) tiles[i].focus(); else $('#close').focus();
}
function step(dir) {
  const n = state.folder.photos.length;
  state.index = (state.index + dir + n) % n;
  render();
  body.querySelector(dir < 0 ? '.prev' : '.next').focus();
}

/* ---------- Window contents ---------- */
function render() {
  const f = state.folder, n = f.photos.length, viewing = state.index !== null;
  body.replaceChildren();
  $('#back').hidden = !viewing;

  if (viewing) {
    const p = f.photos[state.index];
    $('#win-title').textContent = f.id + ' · photo ' + (state.index + 1) + ' of ' + n;
    $('#status').textContent = p.caption || '';
    body.className = 'body viewer';
    const prev = el('button', 'nav prev'); prev.type = 'button';
    prev.setAttribute('aria-label', 'Previous photo'); prev.innerHTML = ARROW.prev;
    prev.addEventListener('click', () => step(-1));
    const next = el('button', 'nav next'); next.type = 'button';
    next.setAttribute('aria-label', 'Next photo'); next.innerHTML = ARROW.next;
    next.addEventListener('click', () => step(1));
    const stage = el('div', 'stage');
    const img = el('img');
    img.src = p.full;
    img.alt = p.caption || 'Photo ' + (state.index + 1) + ' from ' + f.id;
    stage.appendChild(img);
    body.append(prev, stage, next);
    return;
  }

  $('#win-title').textContent = f.id;
  if (f.type === 'video') {
    body.className = 'body empty';
    body.appendChild(el('p', null, 'Videos are coming soon.'));
    $('#status').textContent = '';
    return;
  }

  body.className = 'body';
  const grid = el('div', 'grid');
  if (n) {
    f.photos.forEach((p, i) => {
      const t = el('button', 'tile'); t.type = 'button';
      t.style.setProperty('--tone', TONES[i % TONES.length]);
      t.setAttribute('aria-label', 'Open photo ' + (i + 1) + ' of ' + n);
      const img = el('img'); img.src = p.thumb; img.alt = p.caption || '';
      img.loading = 'lazy';
      img.addEventListener('error', () => img.remove());
      t.appendChild(img);
      t.addEventListener('click', () => { state.index = i; render(); body.querySelector('.next').focus(); });
      grid.appendChild(t);
    });
    $('#status').textContent = n + (n === 1 ? ' photo' : ' photos');
  } else {
    for (let i = 0; i < 8; i++) {
      const g = el('div', 'tile ghost');
      g.style.setProperty('--tone', TONES[i % TONES.length]);
      g.setAttribute('aria-hidden', 'true');
      grid.appendChild(g);
    }
    $('#status').textContent = 'No photos in this folder yet';
  }
  body.appendChild(grid);
}

/* ---------- Controls ---------- */
$('#close').addEventListener('click', closeFolder);
$('#back').addEventListener('click', backToGallery);
scrim.addEventListener('click', (e) => { if (e.target === scrim) closeFolder(); });

document.addEventListener('keydown', (e) => {
  if (scrim.hidden) return;
  if (e.key === 'Escape') { state.index !== null ? backToGallery() : closeFolder(); return; }
  if (state.index !== null) {
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  }
  if (e.key === 'Tab') {                       /* keep focus inside the open window */
    const items = [...win.querySelectorAll('button')].filter((b) => !b.hidden && !b.closest('[hidden]'));
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
</script>
</body>
</html>
